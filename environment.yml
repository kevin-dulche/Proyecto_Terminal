name: qm9-similitud
channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.8
  - pip

  # Jupyter
  - jupyter                # Para Jupyter Notebooks

  # Química
  - rdkit                    # Se llama 'rdkit' en conda (no rdkit-pypi)

  # Word2Vec
  - gensim=3.8.3

  # Reducción de dimensionalidad y clustering
  - umap-learn
  - hdbscan
  - scikit-learn

  # Datos y visualización
  - pandas
  - numpy
  - scipy
  - plotly
  - tqdm

  # Instalación de PyTorch SOLO para CPU
  - pytorch=2.2.0
  - cpuonly

  # mol2vec no está en conda: se instala via pip desde GitHub
  - pip:
    - git+https://github.com/samoturk/mol2vec

# ============================================================
# NOTA GPU:
# Si tienes una GPU con CUDA 11.8, reemplaza:
#   - pytorch=2.2.0
#   - cpuonly
# por:
#   - pytorch=2.2.0
#   - pytorch-cuda=11.8
# ============================================================
