name: qm9-similitud
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.8
  - pip

  # Jupyter
  - ipykernel                # Para Jupyter Notebooks

  # Química
  - rdkit                    # Se llama 'rdkit' en conda (no rdkit-pypi)

  # Word2Vec
  - gensim=3.8.3

  # Reducción de dimensionalidad y clustering
  - umap-learn=0.5.6
  - hdbscan=0.8.38
  - scikit-learn=1.4.1

  # Datos y visualización
  - pandas=2.2.1
  - numpy=1.26.4
  - scipy=1.12.0
  - plotly=5.20.0
  - tqdm=4.66.2

  # mol2vec no está en conda: se instala via pip desde GitHub
  - pip:
    - git+https://github.com/samoturk/mol2vec

# ============================================================
# NOTA GPU:
# Si tienes una GPU con CUDA 11.8, reemplaza:
#   - pytorch=2.2.0
#   - cpuonly
# por:
#   - pytorch=2.2.0
#   - pytorch-cuda=11.8
# ============================================================
