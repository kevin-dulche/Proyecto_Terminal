name: qm9-similitud
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - jupyter
  - rdkit
  - gensim=3.8.3
  - umap-learn
  - hdbscan
  - scikit-learn
  - pandas
  - numpy
  - scipy
  - plotly
  - tqdm

  # Instalación de PyTorch con soporte CUDA (GPU)
  - pytorch=2.2.0
  - pytorch-cuda=11.8
  - pip:
    - git+https://github.com/samoturk/mol2vec